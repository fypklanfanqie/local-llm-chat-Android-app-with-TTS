# MNN 自适应推理权威 CI 门禁（Task 16）
# 顺序：JVM 测试 -> pinned native 构建 -> 16KiB/清单审计 -> APK 组装 -> APK 原生审计(无 libQnn*) -> 模拟器冒烟
name: android-native-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK r27c
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: "27.2.12479018"

      - name: JVM unit tests
        run: |
          ./gradlew testDebugUnitTest --console=plain

      - name: Static checks
        run: |
          git diff --check
          python3 -m py_compile scripts/native/verify_native_bundle.py

      - name: Pinned native build
        run: |
          # 复用 scripts/native/build_mnn_android.sh（NDK r27c + pinned MNN commit + 16KiB 对齐）
          bash scripts/native/build_mnn_android.sh

      - name: Native verifier (16KiB + manifest hashes)
        run: |
          python3 scripts/native/verify_native_bundle.py --dir app/src/main/jniLibs/arm64-v8a --manifest app/src/main/jniLibs/native-manifest.json

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain

      - name: APK native audit (no libQnn* + zipalign)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if unzip -l "$APK" | grep -q "libQnn"; then
            echo "标准 APK 不应含 QNN 库"; exit 1
          fi
          "$ANDROID_HOME"/build-tools/*/zipalign -c 4 "$APK"

      - name: Emulator instrumentation (runtime tests, skip-if-no-fixture)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb shell settings put global window_animation_scale 0
            ./gradlew connectedDebugAndroidTest --console=plain || \
              echo "instrumentation may skip with 'no model fixture' assumption; see reports"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports
            app/build/outputs/apk/debug/*.apk
            app/src/main/jniLibs/native-manifest.json
