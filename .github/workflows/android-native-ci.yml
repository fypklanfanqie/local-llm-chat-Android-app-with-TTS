# MNN 自适应推理权威 CI 门禁（Task 16）
# 顺序：JVM 测试 -> pinned native 构建 -> 16KiB/清单审计 -> APK 组装 -> APK 原生审计(无 libQnn*) -> 模拟器冒烟
name: android-native-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK r26b
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          # android-actions/setup-android（v3/v4）没有 ndk-version 输入——该键只会被
          # runner 静默忽略，旧工作流的 27.2 从未真正安装过。NDK 需经 sdkmanager
          # 包语法安装，落盘于 $ANDROID_HOME/ndk/<version>（26.1 与
          # build_mnn_android.sh 的 NDK_VERSION / manifest ndkVersion 单一事实源一致）。
          packages: "tools platform-tools ndk;26.1.10909125"

      - name: JVM unit tests
        run: |
          ./gradlew testDebugUnitTest --console=plain

      - name: Android Lint (NewApi gate)
        run: |
          # 未守卫高版本 API 的冷启动闪退（Process.myProcessName since=33，minSdk=24）
          # 能上线正是因为 CI 无 lint、本地无法编译。lintDebug 的 NewApi/ObsoleteSdkInt
          # 检查作为门禁：error 级问题直接失败。
          ./gradlew :app:lintDebug --console=plain

      - name: Static checks
        run: |
          git diff --check
          python3 -m py_compile scripts/native/verify_native_bundle.py

      - name: Pinned native build
        env:
          # setup-android 只导出 ANDROID_HOME / ANDROID_SDK_ROOT，不导出
          # ANDROID_NDK_HOME；build_mnn_android.sh 预检要求该变量，故按 sdkmanager
          # 安装布局显式指定（与 manifest ndkVersion 26.1.10909125 一致）。
          ANDROID_NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/26.1.10909125"
        run: |
          # 复用 scripts/native/build_mnn_android.sh（NDK 26.1.10909125 + pinned MNN commit + 16KiB 对齐）
          bash scripts/native/build_mnn_android.sh

      - name: Native verifier (16KiB + manifest hashes)
        run: |
          python3 scripts/native/verify_native_bundle.py --dir app/src/main/jniLibs/arm64-v8a --manifest app/src/main/jniLibs/native-manifest.json

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain

      - name: APK native audit (no libQnn* + zipalign)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if unzip -l "$APK" | grep -q "libQnn"; then
            echo "标准 APK 不应含 QNN 库"; exit 1
          fi
          # glob 会匹配多个 build-tools 版本目录造成多余参数；先取第一个再调用
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | head -1)
          "$ZIPALIGN" -c 4 "$APK"

      - name: Emulator instrumentation (runtime tests, skip-if-no-fixture)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # 注意：script 内不要用 "\" 续行（action 拼接脚本时续行符会被破坏，
          # 报 `\: not found` 且 echo 兜底不执行）。单行化 + 先等设备就绪
          # （软件模拟 boot 慢，gradle 立即跑会报 No compatible devices connected）。
          script: |
            adb shell settings put global window_animation_scale 0
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --console=plain || echo "instrumentation may skip with 'no model fixture' assumption; see reports"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports
            app/build/outputs/apk/debug/*.apk
            app/src/main/jniLibs/native-manifest.json
